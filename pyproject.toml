[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-air-quality-weather-pipeline"
version = "0.1.0"
description = "Vietnam air-quality and weather data engineering pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Streamlit and Altair left with the dashboard they existed for. What remains is
# what the pipeline itself needs: an HTTP client for the two providers, DuckDB and
# pandas for the warehouse and the serving queries, and settings.
dependencies = [
    "duckdb>=1.1,<2",
    "httpx>=0.28,<1",
    "pandas>=2.3,<3",
    "pydantic-settings>=2.14,<3",
]

[project.scripts]
vn-air-pipeline = "vn_air_quality_weather.pipeline:main"
vn-air-forecast = "vn_air_quality_weather.forecast_pipeline:main"

[project.optional-dependencies]
# Transform and ingestion engines. Kept as an extra rather than as base dependencies
# because reading the warehouse does not require the machinery that fills it, and the
# Airflow image and CI install this explicitly.
etl = [
    "boto3>=1.40,<2",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "dlt[duckdb]>=1.29,<2",
    # Publishing the serving marts into SQL Server. Kept in this extra rather than
    # in the base dependencies because nothing that reads the warehouse imports it:
    # the publish runs at the end of a pipeline, and it needs a system ODBC driver
    # that a read-only app host has no reason to install.
    "pyodbc>=5.2,<6",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=vn_air_quality_weather --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["vn_air_quality_weather"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
