[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-air-quality-weather-pipeline"
version = "0.1.0"
description = "Vietnam air-quality and weather data engineering pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "altair>=5.4,<6",
    "duckdb>=1.1,<2",
    "httpx>=0.28,<1",
    "pandas>=2.3,<3",
    "pydantic-settings>=2.14,<3",
    "streamlit>=1.60,<1.61",
]

[project.scripts]
vn-air-pipeline = "vn_air_quality_weather.pipeline:main"
vn-air-forecast = "vn_air_quality_weather.forecast_pipeline:main"

[project.optional-dependencies]
# Transform and ingestion engines stay out of the read-only app runtime. The
# dashboard never imports them, while pipelines, dbt commands and tests that import
# pipeline/loader modules install this extra explicitly.
etl = [
    "boto3>=1.40,<2",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "dlt[duckdb]>=1.29,<2",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
]
# The read API only. Kept out of the default group for the same reason the transform
# engines are: the dashboard never imports it, and a read-only app runtime should not
# carry a web framework it does not use.
#
# Which environments this changes, checked rather than assumed after a previous extra
# was added to three of the four places that install this project and turned CI red.
# Only CI needs it, because only CI runs pytest: refresh-demo-warehouse installs
# `etl` and runs pipelines, airflow/Dockerfile runs DAGs, and requirements.txt serves
# the dashboard -- none of the three imports `api`.
api = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
]
# Browser-driven layout checks only. AppTest has no DOM and no layout engine, so it
# cannot see a chart wider than its container or a value clipped by CSS -- both of
# which shipped, and one of which recurred at a breakpoint the first fix did not
# cover. Kept out of `dev` because it needs `playwright install chromium` (a browser
# download) before it can run, and the rest of `dev` must stay installable offline.
qa = [
    "playwright>=1.49,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=vn_air_quality_weather --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["vn_air_quality_weather"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
