[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-air-quality-weather-pipeline"
version = "0.1.0"
description = "Vietnam air-quality and weather data engineering pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.40,<2",
    "dbt-duckdb>=1.9,<2",
    "dlt[duckdb]>=1.29,<2",
    "httpx>=0.28,<1",
    "pandas>=2.3,<3",
    "plotly>=6,<7",
    "pydantic-settings>=2.14,<3",
    "streamlit>=1.49,<2",
]

[project.scripts]
vn-air-pipeline = "vn_air_quality_weather.pipeline:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
