name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade --editable ".[dev,etl]"
      - name: Lint and unit tests
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
          python -m compileall -q src airflow/dags scripts
      - name: Build offline warehouse fixture
        run: python scripts/build_demo_warehouse.py --database data/warehouse/ci.duckdb
      - name: Build and test dbt models
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Check dbt source freshness
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt source freshness --project-dir dbt --profiles-dir dbt

      - name: Generate dbt docs
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --static
      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/static_index.html
          if-no-files-found: warn
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose -f airflow/docker-compose.yml config --quiet
      - name: Import Airflow DAGs in the runtime image
        run: |
          docker compose -f airflow/docker-compose.yml build airflow-scheduler
          # This is the only check that exercises timetable semantics in real Airflow;
          # host pytest guards the source declaration only. `bag.dags[...]` rather
          # than `bag.get_dag(...)`: the latter falls back to the serialised DAG in
          # the metadata database, and this step runs with --no-deps so there is no
          # postgres to reach. The parsed DAG is already in memory.
          docker compose -f airflow/docker-compose.yml run --rm --no-deps airflow-scheduler \
            python -c "from airflow.models import DagBag; \
            import pendulum; \
            bag = DagBag('/opt/airflow/dags'); \
            print('DAGS=', sorted(bag.dag_ids)); \
            print('IMPORT_ERRORS=', bag.import_errors); \
            assert not bag.import_errors, bag.import_errors; \
            daily = bag.dags['vn_air_quality_weather_daily']; \
            assert type(daily.timetable).__name__ == 'CronDataIntervalTimetable', f'daily run_after=2026-08-14T02:00Z requires CronDataIntervalTimetable, got {type(daily.timetable).__name__}'; \
            di = daily.timetable.infer_manual_data_interval(run_after=pendulum.datetime(2026, 8, 14, 2, 0, tz='UTC')); \
            assert di.start.date().isoformat() == '2026-08-13', f'daily run_after=2026-08-14T02:00Z resolved data_interval_start={di.start.date()}'; \
            forecast = bag.dags['vn_air_quality_weather_forecast']; \
            assert type(forecast.timetable).__name__ == 'CronTriggerTimetable', type(forecast.timetable).__name__"
