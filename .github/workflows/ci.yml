name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade --editable ".[dev]"
      - name: Lint and unit tests
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
          python -m compileall airflow/dags dashboard
      - name: Build offline warehouse fixture
        run: python scripts/build_demo_warehouse.py --database data/warehouse/ci.duckdb
      - name: Build and test dbt models
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose -f airflow/docker-compose.yml config --quiet
