name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade --editable ".[dev,etl]"
      - name: Lint and unit tests
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
          python -m compileall -q src dashboard airflow/dags scripts
      - name: Build offline warehouse fixture
        run: python scripts/build_demo_warehouse.py --database data/warehouse/ci.duckdb
      - name: Build and test dbt models
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Verify every Streamlit page
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: python scripts/verify_streamlit.py
      - name: Check dbt source freshness
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt source freshness --project-dir dbt --profiles-dir dbt

      # The three browser gates below are the only checks that can see a chart wider
      # than its container, text clipped by CSS, a colour below WCAG contrast, or a
      # control Tab cannot reach. AppTest has no DOM and no layout engine, so none of
      # those defect classes is reachable from `verify_streamlit.py` -- and every one
      # of them has shipped in this project at least once. Running them only by hand
      # is what let four of them reach a reader.
      - name: Install browser QA tooling
        run: |
          python -m pip install --editable ".[qa]"
          python -m playwright install --with-deps chromium

      - name: Start the dashboard
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: |
          # Must launch from the project root: Streamlit reads .streamlit/config.toml
          # relative to the working directory and silently drops the theme otherwise,
          # which would change every colour the contrast gate measures.
          streamlit run dashboard/app.py --server.port 8501 --server.headless true &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "dashboard up"; exit 0
            fi
            sleep 2
          done
          echo "dashboard did not become healthy in 120s" >&2
          exit 1

      # --skip-live-api drops the custom-location page, whose driver enters
      # coordinates and calls the real forecast API. CI is offline and deterministic
      # by contract, so eight gated pages beat nine flaky ones; that page stays a
      # manual check. Removing the flag is a deliberate decision, not a tidy-up.
      - name: Verify layout in a real browser
        run: python scripts/verify_layout.py --skip-live-api

      - name: Verify text contrast (WCAG 2.1 AA)
        run: python scripts/verify_a11y.py --skip-live-api

      - name: Verify keyboard access (WCAG 2.1.1 / 2.4.3 / 2.4.7)
        run: python scripts/verify_keyboard.py --skip-live-api
      - name: Generate dbt docs
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --static
      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/static_index.html
          if-no-files-found: warn
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose -f airflow/docker-compose.yml config --quiet
      - name: Import Airflow DAGs in the runtime image
        run: |
          docker compose -f airflow/docker-compose.yml build airflow-scheduler
          # This is the only check that exercises timetable semantics in real Airflow;
          # host pytest guards the source declaration only. `bag.dags[...]` rather
          # than `bag.get_dag(...)`: the latter falls back to the serialised DAG in
          # the metadata database, and this step runs with --no-deps so there is no
          # postgres to reach. The parsed DAG is already in memory.
          docker compose -f airflow/docker-compose.yml run --rm --no-deps airflow-scheduler \
            python -c "from airflow.models import DagBag; \
            import pendulum; \
            bag = DagBag('/opt/airflow/dags'); \
            print('DAGS=', sorted(bag.dag_ids)); \
            print('IMPORT_ERRORS=', bag.import_errors); \
            assert not bag.import_errors, bag.import_errors; \
            daily = bag.dags['vn_air_quality_weather_daily']; \
            assert type(daily.timetable).__name__ == 'CronDataIntervalTimetable', f'daily run_after=2026-08-14T02:00Z requires CronDataIntervalTimetable, got {type(daily.timetable).__name__}'; \
            di = daily.timetable.infer_manual_data_interval(run_after=pendulum.datetime(2026, 8, 14, 2, 0, tz='UTC')); \
            assert di.start.date().isoformat() == '2026-08-13', f'daily run_after=2026-08-14T02:00Z resolved data_interval_start={di.start.date()}'; \
            forecast = bag.dags['vn_air_quality_weather_forecast']; \
            assert type(forecast.timetable).__name__ == 'CronTriggerTimetable', type(forecast.timetable).__name__"
