name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade --editable ".[dev]"
      - name: Lint and unit tests
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
          python -m compileall -q src dashboard airflow/dags scripts
      - name: Build offline warehouse fixture
        run: python scripts/build_demo_warehouse.py --database data/warehouse/ci.duckdb
      - name: Build and test dbt models
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Verify every Streamlit page
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: python scripts/verify_streamlit.py
      - name: Check dbt source freshness
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt source freshness --project-dir dbt --profiles-dir dbt
      - name: Generate dbt docs
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --static
      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/static_index.html
          if-no-files-found: warn
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose -f airflow/docker-compose.yml config --quiet
      - name: Import Airflow DAGs in the runtime image
        run: |
          docker compose -f airflow/docker-compose.yml build airflow-scheduler
          docker compose -f airflow/docker-compose.yml run --rm --no-deps airflow-scheduler \
            python -c "from airflow.models import DagBag; bag = DagBag('/opt/airflow/dags'); print('DAGS=', sorted(bag.dag_ids)); print('IMPORT_ERRORS=', bag.import_errors); assert not bag.import_errors"
