x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0-python3.11}
  env_file:
    - ../.env
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    PYTHONPATH: /opt/project/src
    DUCKDB_PATH: /opt/project/data/warehouse/vn_air_quality_weather.duckdb
    # Airflow 3 runs a scheduled task in a supervised subprocess that calls back
    # into the Task Execution API. The default is http://localhost:8080/execution/,
    # which is only correct for `airflow standalone`. Here the API server is a
    # separate container, so localhost:8080 refuses the connection and every
    # scheduled task dies immediately -- after flushing "Pre Execute" and before
    # writing any traceback, so the task log looks empty rather than broken.
    # `airflow dags test` runs in-process and never touches this path, which is
    # why every DAG check in this repository passed while nothing could be
    # scheduled. See finding M.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # The supervisor signs a JWT to call the API above. With [api_auth] jwt_secret
    # unset each container generates its own at startup, so the scheduler's token
    # is not valid at the API server and every task dies with "Invalid auth token"
    # -- again with no traceback in the task log. All containers must share one.
    # Dev-grade on purpose, like SIMPLE_AUTH_MANAGER_USERS above: this stack binds
    # to localhost and is not production-ready. Override AIRFLOW_JWT_SECRET in .env
    # for anything that is not a local machine.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-shared-jwt-secret}
    # SQLSERVER_HOST arrives from ../.env as `localhost`, which is correct on the
    # developer's machine and wrong inside a container, where it resolves to the
    # container itself and the publish fails with a connection refused that names
    # a host the reader believes is running. Overridden here rather than in .env
    # because .env is also read by the same scripts run from PowerShell, where
    # `localhost` is right. Everything else about the connection -- database, user,
    # password, encryption -- still comes from .env and is not restated.
    SQLSERVER_HOST: ${SQLSERVER_HOST_FROM_CONTAINER:-host.docker.internal}
    # The publish credential is passed through from the shell that runs compose,
    # because it no longer lives in .env: the password is a user-scope Windows
    # environment variable and .env leaves both fields blank on purpose. Before this
    # line the container read those blanks through env_file and publish_serving_copy
    # failed with "SQLSERVER_USER is required" on every run -- a regression invisible
    # to every host-side check, because the host scripts read the variables directly.
    # `:-` rather than `:?` so `docker compose config` and image builds still work
    # without a SQL Server, as CI needs; scripts/preflight.ps1 is what reports them
    # missing before the stack is started. Expected values: vn_air_publish and its
    # password, never the read-only web login.
    SQLSERVER_USER: ${SQLSERVER_USER:-}
    SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
  extra_hosts:
    # Docker Desktop resolves host.docker.internal on its own; this makes the same
    # compose file work on a plain Linux daemon, where it does not.
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags
    # src is mounted, not only baked into the image. PYTHONPATH points at
    # /opt/project/src, and with dags/ bind-mounted while src/ came from the image
    # the two drifted apart silently: editing a DAG took effect immediately while
    # the library module it imported stayed at whatever the last image build
    # contained, so a DAG could reference a module that did not exist in the
    # container and nothing outside Airflow would notice.
    - ../src:/opt/project/src
    - ../data:/opt/project/data
    - ../dbt:/opt/project/dbt
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  # A Windows-to-WSL2 bind mount can transiently raise EIO while the DAG processor
  # scans dags/. Without a restart policy that one process dies while the scheduler
  # and UI stay healthy-looking, so scheduled runs stop silently until a human notices.
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow-postgres:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    # DuckDB accepts one writer at a time. max_active_runs is per DAG, so it does
    # not stop the historical and forecast DAGs overlapping -- the daily DAG runs
    # with catchup enabled and allows 45 minutes to extract plus 20 to build, which
    # is long enough to still be holding the file when a six-hourly forecast run
    # starts. A single-slot pool is the smallest change that actually serialises
    # every warehouse writer.
    command: >
      bash -c "airflow db migrate &&
      airflow pools set warehouse_writer 1
      'Serialises DuckDB writers: one dbt build or load at a time'"
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      # Host 8081, container 8080. Tomcat already owns host 8080 for vn-air-web and
      # two other web projects, and the Hadoop lab on this machine holds 8088, so the
      # two halves of this project could not run at the same time. Only the host side
      # moves: every container still reaches the API at airflow-api-server:8080, which
      # is what EXECUTION_API_SERVER_URL and the healthcheck below depend on. Set
      # AIRFLOW_API_PORT in the environment that runs compose to choose another; note
      # that compose interpolates from the shell and from airflow/.env, not ../.env.
      - "${AIRFLOW_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres:
