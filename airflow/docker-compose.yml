x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0-python3.11}
  env_file:
    - ../.env
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    PYTHONPATH: /opt/project/src
    DUCKDB_PATH: /opt/project/data/warehouse/vn_air_quality_weather.duckdb
  volumes:
    - ./dags:/opt/airflow/dags
    - ../data:/opt/project/data
    - ../dbt:/opt/project/dbt
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow-postgres:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    # DuckDB accepts one writer at a time. max_active_runs is per DAG, so it does
    # not stop the historical and forecast DAGs overlapping -- the daily DAG runs
    # with catchup enabled and allows 45 minutes to extract plus 20 to build, which
    # is long enough to still be holding the file when a six-hourly forecast run
    # starts. A single-slot pool is the smallest change that actually serialises
    # every warehouse writer.
    command: >
      bash -c "airflow db migrate &&
      airflow pools set warehouse_writer 1
      'Serialises DuckDB writers: one dbt build or load at a time'"
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres:
