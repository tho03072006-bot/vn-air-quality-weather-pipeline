name: vn_air_quality_weather
version: 1.0.0
config-version: 2

profile: vn_air_quality_weather
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages", "logs"]

seeds:
  vn_air_quality_weather:
    +schema: analytics
    provinces_2025:
      +column_types:
        province_code: varchar

models:
  vn_air_quality_weather:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # Materialised as a table: the hourly spine is a filtered cross product
      # plus twelve lag windows, and both AQI marts read it.
      +materialized: table
      +schema: staging
    dimensions:
      +materialized: table
      +schema: analytics
    facts:
      +materialized: table
      +schema: analytics
    marts:
      +materialized: table
      +schema: analytics
