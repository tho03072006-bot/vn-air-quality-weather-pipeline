version: 2

sources:
  - name: raw
    schema: raw
    description: Incremental dlt tables loaded from immutable API responses.
    tables:
      - name: weather_hourly
        loaded_at_field: observed_at_utc
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 72, period: hour}
      - name: air_quality_hourly
        loaded_at_field: observed_at_utc
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 72, period: hour}
      - name: pipeline_runs
        description: One row per pipeline execution, written by the loader after each merge.
        loaded_at_field: finished_at_utc
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 72, period: hour}
      - name: air_quality_forecast_hourly
        description: Versioned modeled air-quality forecasts by location and valid hour.
        loaded_at_field: forecast_issued_at_utc
        freshness:
          warn_after: {count: 18, period: hour}
          error_after: {count: 36, period: hour}
      - name: weather_forecast_hourly
        description: Versioned weather forecasts by location and valid hour.
        loaded_at_field: forecast_issued_at_utc
        freshness:
          warn_after: {count: 18, period: hour}
          error_after: {count: 36, period: hour}
      - name: air_quality_at_station_hourly
        description: >
          The model sampled at a monitoring station's own coordinates, kept out of
          air_quality_hourly so a third source_type cannot become a third series in
          every city-grain model. Deliberately carries no freshness block: it is
          absent entirely from every warehouse written before it existed, including
          the published release asset, and a freshness rule on a table that may not
          be there would fail for the wrong reason.
